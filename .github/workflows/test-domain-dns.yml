name: Test domain DNS on GitHub

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain(s) to resolve. One per line, or comma/space separated."
        required: true
        type: string

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve on the GitHub runner
        env:
          TEST_DOMAINS: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import ipaddress
          import os
          import socket
          import subprocess

          raw = os.environ.get("TEST_DOMAINS", "")
          text = raw.replace(",", "\n").replace(";", "\n")
          names = []
          seen = set()
          for part in text.split():
              name = part.strip().lower().rstrip(".")
              if name and name not in seen:
                  seen.add(name)
                  names.append(name)

          if not names:
              raise SystemExit("No domains provided")

          print("Runner resolver:")
          try:
              print(open("/etc/resolv.conf", encoding="utf-8").read())
          except OSError:
              pass

          resolvers = [
              ("systemd/default", None),
              ("Google 8.8.8.8", "8.8.8.8"),
              ("Cloudflare 1.1.1.1", "1.1.1.1"),
              ("Quad9 9.9.9.9", "9.9.9.9"),
              ("OpenDNS 208.67.222.222", "208.67.222.222"),
          ]

          def dig(name, rtype, server=None):
              cmd = ["dig", "+time=3", "+tries=1", "+nocmd", "+noall", "+answer"]
              if server:
                  cmd.append(f"@{server}")
              cmd.extend([name, rtype])
              try:
                  return subprocess.check_output(cmd, text=True, timeout=10).strip()
              except Exception as exc:
                  return f"failed: {exc}"

          for name in names:
              print("=" * 72)
              print(f"Domain: {name}")
              all_v4, all_v6 = set(), set()
              for label, server in resolvers:
                  print(f"--- {label} ---")
                  a = dig(name, "A", server)
                  aaaa = dig(name, "AAAA", server)
                  print("A:")
                  print(a or "(none)")
                  print("AAAA:")
                  print(aaaa or "(none)")
                  for line in (a + "\n" + aaaa).splitlines():
                      parts = line.split()
                      if len(parts) >= 5 and parts[3] in {"A", "AAAA"}:
                          try:
                              addr = ipaddress.ip_address(parts[4])
                          except ValueError:
                              continue
                          (all_v4 if addr.version == 4 else all_v6).add(str(addr))

              print("--- UNION ---")
              print("IPv4:")
              print("\n".join(sorted(all_v4, key=lambda x: ipaddress.ip_address(x))) or "(none)")
              print("IPv6:")
              print("\n".join(sorted(all_v6, key=lambda x: ipaddress.ip_address(x))) or "(none)")
          PY