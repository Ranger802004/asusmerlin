name: Resolve domainlists to iplists

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "domain_vpn_routing/domainlists/**"
      - ".github/scripts/resolve_domains.py"
      - ".github/workflows/resolve-domainlists.yml"
      - ".github/workflows/resolve-domainslists.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve domain lists
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p domain_vpn_routing/iplists
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "Scheduled run; resolving all lists"
            python3 .github/scripts/resolve_domains.py \
              --domain-dir domain_vpn_routing/domainlists \
              --iplist-dir domain_vpn_routing/iplists \
              --mode all
          elif [ "$EVENT_NAME" = "push" ]; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD -- domain_vpn_routing/domainlists || true)"
            if [ -z "$CHANGED" ]; then
              echo "Push did not change any domain lists; skipping resolve"
              exit 0
            fi
            echo "Push changed:"
            echo "$CHANGED"
            python3 .github/scripts/resolve_domains.py \
              --domain-dir domain_vpn_routing/domainlists \
              --iplist-dir domain_vpn_routing/iplists \
              --files $CHANGED
          else
            echo "Manual run; resolving only domain lists whose content changed"
            python3 .github/scripts/resolve_domains.py \
              --domain-dir domain_vpn_routing/domainlists \
              --iplist-dir domain_vpn_routing/iplists \
              --mode changed
          fi

      - name: Commit IP lists if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p domain_vpn_routing/iplists
          touch domain_vpn_routing/iplists/.gitkeep
          git add -A domain_vpn_routing/iplists
          if git diff --staged --quiet; then
            echo "No IP list changes"
          else
            git commit -m "Update resolved IPv4/IPv6 lists from domainlists"
            git push
          fi