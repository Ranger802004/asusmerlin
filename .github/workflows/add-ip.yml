name: Add IP or CIDR to list

on:
  workflow_dispatch:
    inputs:
      list:
        description: "List name without .txt (youtube, fox-one, spotify)"
        required: true
        type: string
      entry:
        description: "IP and/or CIDR values. One per line, or comma/space separated."
        required: true
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Add IP/CIDR values
        env:
          ADD_LIST: ${{ inputs.list }}
          ADD_ENTRY: ${{ inputs.entry }}
        run: |
          mkdir -p domain_vpn_routing/iplists
          python3 .github/scripts/add_ip.py \
            --iplist-dir domain_vpn_routing/iplists \
            --list "$ADD_LIST" \
            --entry "$ADD_ENTRY"

      - name: Collapse accumulative IPs to CIDRs
        run: |
          python3 .github/scripts/collapse_iplists.py \
            --iplist-dir domain_vpn_routing/iplists

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p domain_vpn_routing/iplists
          touch domain_vpn_routing/iplists/.gitkeep
          git add -A domain_vpn_routing/iplists
          if git diff --staged --quiet; then
            echo "No IP list changes"
          else
            git commit -m "Add IP/CIDR value(s) to ${{ inputs.list }}"
            git push
          fi
